<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Special s 
  
  </title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="scene">
    <div class="background-glow"></div>
    <div class="petal-layer"></div>
    <header class="hero">
      <div class="flower-ring" id="flowerButton" aria-label="Tap to show a message">
        <div class="rose">
          <div class="petal petal-1"></div>
          <div class="petal petal-2"></div>
          <div class="petal petal-3"></div>
          <div class="petal petal-4"></div>
          <div class="petal petal-5"></div>
          <div class="rose-core"></div>
        </div>
      </div>
      <p class="subtitle">To a Special Person (S)</p>
      <button id="revealButton" class="reveal-button" type="button">Reveal message</button>
    </header>

    <section class="message-panel">
      <div class="message-line" id="line1"></div>
      <div class="message-line" id="line2"></div>
      <div class="message-line" id="line3"></div>
      <div class="message-line" id="line4"></div>
      <div class="message-line" id="line5"></div>
    </section>
  </div>

  <audio id="bgMusic" loop></audio>
  <script src="script.js"></script>
</body>
</html>
